// Throwaway benchmark for the official MediaPipe Kokoro text-to-speech task on a real phone.
// Not part of the reader app; it exists to answer "how fast, on which backend, does markup work".
plugins {
    id 'com.android.application'
}

android {
    namespace = 'dev.milagro.kokorobench'
    compileSdk = 37

    defaultConfig {
        applicationId = "dev.milagro.kokorobench"
        minSdk = 26
        targetSdk = 37
        versionCode = 1
        versionName = "0.1"
        // arm64 for the phone; x86_64 so the same APK runs in the desktop emulator.
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = true } }
}

dependencies {
    implementation 'com.google.mediapipe:tasks-audio:1.2.3'
}
